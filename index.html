function labelOf(list,k){ return list.filter(function(x){return x[0]===k;})[0][1]; }

/* ---------- 유틸 ---------- */
function randInt(n){ var a=new Uint32Array(1), lim=Math.floor(4294967296/n)*n, x; do{ crypto.getRandomValues(a); x=a[0]; }while(x>=lim); return x%n; }
function shuffle(arr){ var a=arr.slice(), i, j, t; for(i=a.length-1;i>0;i--){ j=randInt(i+1); t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function uuid(){ if(crypto.randomUUID) return crypto.randomUUID(); var b=crypto.getRandomValues(new Uint8Array(16)); b[6]=(b[6]&15)|64; b[8]=(b[8]&63)|128; var h=[].map.call(b,function(x){return ("0"+x.toString(16)).slice(-2)}).join(""); return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20); }

var S = null;

  return { id:uuid(), step:"intro", t_start:null, age:null, q1:null, q2:null, wtp:null, order:shuffle([1,2,3,4,5,6,7,8]), q3order:shuffle(Q3.map(function(x){return x[0];})),

    return {ok:false,status:res.status,msg:"HTTP "+res.status+" "+t};
  }catch(e){ return {ok:false,status:0,msg:String(e&&e.message||e)}; }
  finally{ clearTimeout(to); }
}
async function submit(isRetry){
  if(sending) return; if(document.getElementById("hp").value) return; // 봇 차단(허니팟)
  var v=validate(); if(v){ var m=missingStep(); if(m) go(m); return; }
  leaveTiming(); save();
  sending=true; if(S.step!=="sending"){ S.step="sending"; render(); }
  var payload=(isRetry && ls("get",KEY_PENDING)) ? JSON.parse(ls("get",KEY_PENDING)) : buildPayload();
  ls("set",KEY_PENDING,JSON.stringify(payload));
  var ok=false, err="";
  if(!CFG.SUPABASE_URL){ // 로컬 테스트 모드
    var arr=[]; try{ arr=JSON.parse(ls("get",KEY_LOCAL)||"[]"); }catch(e){}
    arr.push(payload); ls("set",KEY_LOCAL,JSON.stringify(arr)); ok=true;
  } else {
    var waits=[0,1200,3500];
    for(var a=0;a<waits.length && !ok;a++){
      if(waits[a]) await sleep(waits[a]);
      var r=await post(payload); ok=r.ok; err=r.msg||"";
      if(!ok && r.status>=400 && r.status<500 && r.status!==408 && r.status!==429) break; // 재시도해도 소용없는 오류
    }
  }
  sending=false;
  if(ok){ ls("del",KEY_PENDING); ls("del",KEY_STATE); if(!IS_TEST) ls("set",KEY_DONE,S.id); S.step="done"; render(); }
  else { S.lastError=err; S.step="fail"; save(); render(); }
}

/* ---------- 시작 ---------- */
S=load();
if(S.step==="sending") S.step="use_values";
if(S.step==="done"||S.step==="out"||S.step==="fail"){ if(S.step==="fail" && ls("get",KEY_PENDING)){} else { S=freshState(); } }
enteredAt=Date.now();
render();
window.__survey={ get state(){return S;}, PROFILES:PROFILES };
})();
</script>
